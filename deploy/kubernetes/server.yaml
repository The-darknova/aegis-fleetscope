apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  namespace: aegis
data:
  DATABASE_URL: "postgresql://aegis:aegis_password@postgres:5432/aegis_fleetscope"
---
apiVersion: v1
kind: Secret
metadata:
  name: server-secret
  namespace: aegis
type: Opaque
stringData:
  SECRET_KEY: "change_this_secret_key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: aegis-server:latest # Replace with your registry image
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: server-config
            - secretRef:
                name: server-secret
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: aegis
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: server
