name: Release Agent

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Determine Release Type
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          # Detect hyphen for pre-release (e.g. v1.0.0-beta.1 or v1.0.0-Alpha.1)
          if [[ "${TAG}" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Go Binaries
        working-directory: agent
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -o bin/aegis-agent-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -o bin/aegis-agent-arm64 ./cmd/agent

      - name: Setup nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Package with nFPM
        working-directory: agent/packaging
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p packages
          # Package for linux/amd64
          export GOARCH=amd64
          envsubst < nfpm.yaml > nfpm.rendered.yaml
          nfpm package --config nfpm.rendered.yaml --packager deb --target packages/
          nfpm package --config nfpm.rendered.yaml --packager rpm --target packages/
          
          # Package for linux/arm64
          export GOARCH=arm64
          envsubst < nfpm.yaml > nfpm.rendered.yaml
          nfpm package --config nfpm.rendered.yaml --packager deb --target packages/
          nfpm package --config nfpm.rendered.yaml --packager rpm --target packages/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: agent/packaging/packages/*
